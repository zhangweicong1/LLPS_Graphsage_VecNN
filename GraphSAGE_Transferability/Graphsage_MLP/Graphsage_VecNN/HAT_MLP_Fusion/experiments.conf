setting {
	num_layers = 2
	hidden_emb_size = 100
}

hat {
	hidden_size = 640 # RNA-FM 的输出维度
	max_sentences = 201 # 一条 RNA 最多划分的 Segment 数量
	num_hidden_layers = 3 # HAT Document Encoder 的层数
	num_attention_heads = 8 # Multi-Head Self-Attention 的 Head 数量
	intermediate_size = 2560 # FFN 的中间层维度
	hidden_act = "gelu" # 激活函数
	hidden_dropout_prob = 0.1 # Dropout
	attention_probs_dropout_prob = 0.1
	initializer_range = 0.02 # Position Embedding
	layer_norm_eps = 1e-12
	position_embedding_type="absolute"
	#pad_token_id = 0
	output_attentions = false # 是否返回 Attention 权重
	output_hidden_states = false # 是否返回每一层的隐藏状态
}

